---
layout: default
title: Footsteps
permalink: /footsteps/
author_profile: false
map: true
excerpt: "Places I have lived and visited."
---

{% include base_path %}

<div class="footsteps-page">
  <h1 class="visually-hidden">{{ page.title }}</h1>
  <div id="footsteps-map" class="footsteps-map" role="region" aria-label="Map of places I have lived and visited"></div>
  <div class="footsteps-overlay">
    <div class="footsteps-hud">
      <p class="footsteps-hud__count" id="footsteps-count"></p>
      <button type="button" class="footsteps-hud__reset" id="footsteps-reset">Reset view</button>
    </div>
    <ul class="footsteps-legend" aria-label="Legend">
      <li class="footsteps-legend__item">
        <span class="footsteps-legend__dot footsteps-legend__dot--lived" aria-hidden="true"></span>
        Lived
      </li>
      <li class="footsteps-legend__item">
        <span class="footsteps-legend__dot footsteps-legend__dot--visited" aria-hidden="true"></span>
        Visited
      </li>
    </ul>
  </div>
</div>

<div id="footsteps-lightbox" class="footsteps-lightbox" hidden>
  <div class="footsteps-lightbox__frame" role="dialog" aria-modal="true" aria-labelledby="footsteps-lightbox-title">
    <div class="footsteps-lightbox__stage">
      <div id="footsteps-lightbox-viewport" class="footsteps-lightbox__viewport">
        <img id="footsteps-lightbox-image" class="footsteps-lightbox__image" alt="" draggable="false">
      </div>
      <div id="footsteps-lightbox-blank" class="footsteps-lightbox__blank"></div>
      <button type="button" class="footsteps-lightbox__nav footsteps-lightbox__nav--prev" id="footsteps-lightbox-prev" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 6L9 12l5.5 6" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="footsteps-lightbox__nav footsteps-lightbox__nav--next" id="footsteps-lightbox-next" aria-label="Next photo">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 6L15 12l-5.5 6" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="footsteps-lightbox__close" id="footsteps-lightbox-close" aria-label="Close">&times;</button>
    </div>
    <div class="footsteps-lightbox__caption">
      <h2 id="footsteps-lightbox-title" class="footsteps-lightbox__title"></h2>
      <p id="footsteps-lightbox-text" class="footsteps-lightbox__text"></p>
    </div>
  </div>
</div>

<pre id="footsteps-data" class="visually-hidden" aria-hidden="true">{{ site.data.footsteps | jsonify }}</pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="{{ base_path }}/assets/js/footsteps.js"></script>
